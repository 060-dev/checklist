name: morro_do_peo
description: "Simplifique as operações da Fazenda Morro do Peão com um aplicativo intuitivo, guiando trabalhadores rurais através de checklists diários de agricultura e pecuária com ícones grandes, áudio e fotos, e oferecendo aos gestores"
publish_to: "none"
version: 0.1.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.0.0
  http_parser: ^4.0.0
  image_picker: ">=1.1.2"
  intl: 0.20.2
  uuid: ^4.0.0
  shared_preferences: ^2.0.0
  flutter_secure_storage: ^10.3.1
  google_fonts: ^6.1.0
  connectivity_plus: ^6.0.0
  provider: ^6.1.2
  flutter_tts: ^4.0.0
  go_router: ^16.2.0
  record: ^7.1.0
  audioplayers: ^6.0.0
  path_provider: ^2.1.0
  video_player: ^2.9.0
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  image_path_android: assets/icons/logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icons/logo.png
